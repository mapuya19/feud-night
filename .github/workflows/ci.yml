name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci && npm --prefix worker ci
      - run: npm test
      - run: npm run typecheck && npm run typecheck:worker
      - run: npm run lint
      - run: npm run build
      - name: WebSocket integration smoke test
        shell: bash
        run: |
          npm run dev:worker > /tmp/feud-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in {1..60}; do
            if curl --fail --silent http://localhost:8787/health; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/feud-worker.log
            exit 1
          fi
          npm run smoke || { cat /tmp/feud-worker.log; exit 1; }
